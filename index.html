<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>MoodCam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark film-camera app shell — photo stage on top (left on desktop), tool deck below (right on desktop). Single deliberate dark look. */
:root{
  --bg:#0b0c0a; --panel:#151713; --panel2:#1d1f1a; --line:#2f312a;
  --gold:#d89a36; --gold-soft:#e8c78d; --cream:#f1e8d8; --muted:#a9a497; --dim:#6e6a60; --red:#e5484d;
  --f-brand:"Cormorant Garamond", "Times New Roman", serif;
  --f-ui:"IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--f-ui);font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1280px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
header{display:flex;align-items:center;gap:10px;padding-block:6px 10px}
.brand{flex:1;min-width:0;line-height:1}
.brand b{display:block;font-family:var(--f-brand);font-weight:600;font-size:26px;letter-spacing:.06em;color:var(--gold)}
.brand small{font-size:9px;letter-spacing:.3em;color:var(--gold-soft)}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;white-space:nowrap}
.hbtn.primary{background:var(--gold);border-color:var(--gold);color:#1a1205;font-weight:600}
.hbtn svg{width:16px;height:16px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.main{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0}
@media (min-width:900px){.main{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}}
.stage{position:relative;min-height:220px;background:#000;border-radius:8px;overflow:hidden;display:grid;place-items:center;touch-action:none}
[hidden]{display:none!important}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage .tag{position:absolute;left:10px;top:10px;font:500 10px var(--f-num);letter-spacing:.08em;background:rgba(11,12,10,.7);padding:4px 8px;border-radius:4px;color:var(--gold-soft)}
.stage .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(11,12,10,.7);padding:3px 10px;border-radius:20px;white-space:nowrap}
.stage .tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.chipbtn{height:30px;padding:0 10px;border-radius:4px;background:rgba(11,12,10,.72);border:1px solid var(--line);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chipbtn[disabled]{opacity:.35;cursor:default}
.chipbtn.on{border-color:var(--gold);color:var(--gold)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,12,10,.6);font-size:13px}

.deck{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;max-height:46vh}
@media (min-width:900px){.deck{max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:max-content;padding:12px 12px 10px;font-size:11px;letter-spacing:.12em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--gold);border-color:var(--gold);font-weight:600}
.panel{overflow-y:auto;padding:12px 14px 16px;min-height:0}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{height:30px;padding:0 12px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1205;font-weight:600}

.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.look{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0}
.look canvas{width:100%;height:100%;object-fit:cover;display:block}
.look span{position:absolute;inset:auto 0 0;padding:14px 6px 5px;font-size:11px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.look.on{border:2px solid var(--gold)}
.look .del{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);font-size:12px;line-height:20px}
.group-label{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:14px 0 8px}
.group-label:first-child{margin-top:0}

.row{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;align-items:center;gap:8px;min-height:34px}
.row label{font-size:13px}
.row output{font:12px var(--f-num);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;--track:linear-gradient(90deg,var(--line),var(--line))}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--cream);margin-top:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--cream);border:0}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.switch{width:42px;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);position:relative}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked=true]{background:var(--gold);border-color:var(--gold)}
.switch[aria-checked=true]::after{transform:translateX(18px);background:#fff}
.bands{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.band{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.band.on{border-color:var(--cream)}

.aitools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.aitool{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.aitool i{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-style:normal;font-size:17px;color:var(--cream)}
.aitool.on{color:var(--gold)} .aitool.on i{border-color:var(--gold);color:var(--gold);background:rgba(216,154,54,.12)}
.note{font-size:12px;color:var(--dim);line-height:1.55;margin-top:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.sw b{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:500;font-size:10px;color:var(--muted)}
.sw.on{color:var(--gold)} .sw.on b{border:2px solid var(--gold)}
.text{width:100%;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--cream);padding:0 12px;font:inherit}
.bigbtn{width:100%;height:46px;border-radius:6px;background:var(--gold);color:#1a1205;font-weight:600;letter-spacing:.08em;margin-top:12px}
.bigbtn.ghost{background:var(--panel2);color:var(--cream);border:1px solid var(--line)}
.footer{display:flex;gap:8px;align-items:center;padding-top:10px}
.footer .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:40;padding:20px}
.sheet img{max-width:100%;max-height:70vh;border-radius:6px}
.sheet p{text-align:center;color:var(--muted);font-size:13px}
/* live camera */
.camsheet{position:fixed;inset:0;z-index:30;background:#000;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.camtop{display:flex;align-items:center;gap:6px;padding-block:10px}
.camtop .brand b{font-size:20px}
.vf{position:relative;overflow:hidden;border-radius:8px;background:#000;touch-action:none}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf.front video{transform:scaleX(-1)}
.vf .vig,.vf .gridov,.vf .flash{position:absolute;inset:0;pointer-events:none}
.vf .gridov{background:
  linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.3) calc(33.33% - .5px),rgba(255,255,255,.3) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.3) calc(66.66% - .5px),rgba(255,255,255,.3) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
  linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.3) calc(33.33% - .5px),rgba(255,255,255,.3) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.3) calc(66.66% - .5px),rgba(255,255,255,.3) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.vf .flash{background:#fff;opacity:0;transition:opacity .25s}
.vf .count{position:absolute;inset:0;display:grid;place-items:center;font:600 96px var(--f-brand);color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.vf .camtag{position:absolute;left:10px;bottom:10px;font:500 10px var(--f-num);letter-spacing:.08em;background:rgba(11,12,10,.7);padding:4px 8px;border-radius:4px;color:var(--gold-soft)}
.vf .zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.camlooks{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.camlooks .chip{flex:none}
.cambar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:4px 14px}
.shutter{width:76px;height:76px;border-radius:50%;border:3px solid var(--cream);display:grid;place-items:center}
.shutter::after{content:"";width:60px;height:60px;border-radius:50%;background:var(--cream);transition:transform .1s}
.shutter:active::after{transform:scale(.9)}
.roundbtn{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;justify-self:end}
.roundbtn svg{width:22px;height:22px}
.camthumb{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);background:var(--panel2) center/cover no-repeat}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>MOODCAM</b><small id="edition">FILM EDITOR · WEB · v3</small></div>
    <button class="hbtn" id="install" hidden>ติดตั้งแอป</button>
    <button class="hbtn primary" id="shoot" title="เปิดกล้อง">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>ถ่ายรูป</button>
    <label class="hbtn" for="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>เลือกรูป</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <input id="pick" type="file" accept="image/*">
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="ภาพที่แต่งแล้ว"></canvas>
      <div class="tag" id="tag">SAMPLE · ORIGINAL</div>
      <div class="tools">
        <button class="chipbtn" id="undo" title="ย้อนกลับ" disabled>↶</button>
        <button class="chipbtn" id="redo" title="ทำซ้ำ" disabled>↷</button>
        <button class="chipbtn" id="compare" title="กดค้างเพื่อดูต้นฉบับ">ต้นฉบับ</button>
      </div>
      <div class="hint" id="hint" hidden>ลากที่รูปเพื่อเลื่อนตำแหน่งครอป</div>
      <div class="busy" id="busy" hidden>กำลังเรนเดอร์…</div>
    </div>

    <section class="deck">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="looks" aria-selected="true">LOOKS</button>
        <button role="tab" data-tab="adjust" aria-selected="false">ADJUST</button>
        <button role="tab" data-tab="ai" aria-selected="false">AI BEAUTY</button>
        <button role="tab" data-tab="social" aria-selected="false">SOCIAL</button>
        <button role="tab" data-tab="save" aria-selected="false">SAVE</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</div>

<div class="camsheet" id="camsheet" hidden>
  <div class="camtop">
    <button class="chipbtn" id="camclose" aria-label="ปิดกล้อง">✕</button>
    <div class="brand"><b>MOODCAM</b><small>FILM CAMERA</small></div>
    <button class="chipbtn" id="camtorch" hidden>ไฟฉาย</button>
    <button class="chipbtn on" id="camgrid">Grid</button>
    <button class="chipbtn" id="camtimer">Timer</button>
  </div>
  <div class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <div class="vig" id="vfvig"></div>
    <div class="gridov" id="vfgrid"></div>
    <div class="flash" id="vfflash"></div>
    <div class="count" id="vfcount" hidden></div>
    <div class="camtag" id="camtag">LIVE · ORIGINAL</div>
    <div class="zoom" id="vfzoom" hidden></div>
  </div>
  <div class="camlooks" id="camlooks"></div>
  <div class="cambar">
    <button class="camthumb" id="camthumb" aria-label="ไปหน้าแต่งรูป"></button>
    <button class="shutter" id="shutter" aria-label="ถ่ายรูป"></button>
    <button class="roundbtn" id="camflip" aria-label="สลับกล้องหน้า/หลัง">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg></button>
  </div>
</div>

<script>
"use strict";
// ======================================================================
// Model — looks are plain parameter sets; the same engine renders preview + export
// ======================================================================
const ZERO_HSL = () => [0,1,2,3,4,5].map(() => ({hue:0, sat:0, lum:0}));
const defAdj = () => ({exposure:0,contrast:0,curve:0,density:0,keepBright:0,highlights:0,shadows:0,blacks:0,temp:0,tint:0,vibrance:0,saturation:0,hsl:ZERO_HSL(),
  grain:0,grainSize:30,vignette:0,fade:0,lightLeak:0,halation:0,bloom:0,
  shadowTintHue:200,shadowTintAmt:0,midTintHue:40,midTintAmt:0,highlightTintHue:35,highlightTintAmt:0,mono:false});
const A = o => Object.assign(defAdj(), o);
const hsl6 = arr => arr.map(b => Object.assign({hue:0,sat:0,lum:0}, b));
const H = (o) => hsl6([o.red||{},o.orange||{},o.yellow||{},o.green||{},o.blue||{},o.purple||{}]);
const L = (id,name,cat,desc,adj) => ({id,name,cat,desc,adj:A(id==="original"?adj:Object.assign({curve:45,density:30,keepBright:90},adj))});
const PRESETS = [
  // ---------------- FILM: classic stocks, now with real filmic contrast + halation
  L("original","Original","film","ภาพต้นฉบับ ไม่ปรับสี",{}),
  L("warm_film","Warm Film","film","ฟิล์มอุ่นแดดบ่าย ผิวสวย ไฮไลต์ทองฟุ้ง",{temp:18,tint:6,vibrance:22,saturation:4,contrast:28,blacks:-12,highlights:-12,fade:8,grain:20,vignette:22,halation:22,highlightTintHue:38,highlightTintAmt:40,shadowTintHue:15,shadowTintAmt:18,hsl:H({orange:{sat:10,lum:6}})}),
  L("vintage","Vintage","film","ฟิล์มเก่าซีดหวาน ดำยกตัว เม็ดเกรนชัด",{temp:14,saturation:-22,contrast:12,fade:34,grain:38,vignette:34,highlightTintHue:48,highlightTintAmt:40,shadowTintHue:330,shadowTintAmt:26,halation:12}),
  L("night_film","Night Film","film","ฟิล์มกลางคืน เงาฟ้าเขียว ไฟถนนส้มเรือง",{exposure:-6,temp:-12,tint:6,contrast:38,blacks:-22,saturation:12,grain:26,vignette:30,halation:45,bloom:15,shadowTintHue:195,shadowTintAmt:55,highlightTintHue:30,highlightTintAmt:45}),
  L("teal_orange","Teal & Orange","film","สูตรหนังฮอลลีวูด เงาเขียวน้ำทะเลลึก ผิวส้มทอง",{curve:60,density:42,contrast:30,blacks:-20,highlights:-10,vibrance:22,saturation:10,shadowTintHue:188,shadowTintAmt:78,midTintHue:195,midTintAmt:12,highlightTintHue:30,highlightTintAmt:62,vignette:18,halation:12,hsl:H({orange:{sat:24,lum:-4},yellow:{hue:-25},green:{hue:45,sat:-35},blue:{hue:-15,sat:25,lum:-10}})}),
  L("bw_film","B&W Film","film","ขาวดำฟิล์ม คอนทราสต์แน่น เกรนสวย",{mono:true,contrast:42,blacks:-18,grain:34,vignette:26,fade:6,halation:10}),
  L("golden_hour","Golden Hour","film","แสงทองตอนเย็น อบอุ่น ฟุ้งละมุน",{temp:34,tint:6,exposure:4,vibrance:22,contrast:18,highlights:-18,lightLeak:30,bloom:25,highlightTintHue:40,highlightTintAmt:45,shadowTintHue:20,shadowTintAmt:15}),
  L("soft_portrait","Soft Portrait","film","ถ่ายคนผิวเนียนสว่าง โทนครีมนุ่ม",{exposure:8,contrast:6,shadows:18,temp:8,tint:4,saturation:-6,fade:14,bloom:18,highlightTintHue:25,highlightTintAmt:22,hsl:H({orange:{lum:10,sat:-6},red:{sat:-8}})}),
  // ---------------- CINEMATIC: graded like a feature film
  L("amber_drama","Amber Drama","cine","ดราม่าอำพัน ดำลึก ไฮไลต์ทองหนัก",{temp:24,contrast:46,blacks:-28,shadows:-8,highlights:-20,saturation:-6,vignette:42,halation:30,highlightTintHue:35,highlightTintAmt:60,shadowTintHue:25,shadowTintAmt:25,grain:16}),

const NO_SCALE = new Set(["grainSize","keepBright","shadowTintHue","midTintHue","highlightTintHue","mono","hsl"]);
function effective(a,s){
  if(s===1) return a;
  const o=clone(a);
  for(const k in o){ if(!NO_SCALE.has(k)&&typeof o[k]==="number") o[k]*=s; }

// ======================================================================
// Colour engine: filmic tone curve, split/3-way grading, HSL, halation, bloom, grain
// ======================================================================
const CENTERS=[0,30,60,120,220,290], SPANS=[30,30,40,60,60,50];
function hsvToRgb(h,s,v,out){const c=v*s,hp=h/60,x=c*(1-Math.abs(hp%2-1)),m=v-c;let r,g,b;

  out[0]=r+m;out[1]=g+m;out[2]=b+m;}
function tintOffset(hue,amt,k0=0.26){ if(amt<=0) return [0,0,0]; const o=[0,0,0]; hsvToRgb(((hue%360)+360)%360,1,1,o);
  const avg=(o[0]+o[1]+o[2])/3,k=amt/100*k0; return [(o[0]-avg)*k,(o[1]-avg)*k,(o[2]-avg)*k]; }

function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+1337)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h&0xFFFF)/32767.5-1;}

function applyAdjust(d,w,h,a){

  const sh=a.shadows/100,hi=a.highlights/100,shOn=sh!==0||hi!==0;

  const ck=(a.contrast>=0?a.contrast/100*1.3:a.contrast/100*.55)+a.curve/100*.9, cOn=ck!==0, dn=a.density/100*.5;

          if(dh||ds||dl){let nh=(hue+dh*.3)%360;if(nh<0)nh+=360;const ns=Math.min(1,Math.max(0,s*(1+ds/100)));hsvToRgb(nh,ns,mx*(1+dl/100*.35*s),tmp);r=tmp[0];g=tmp[1];b=tmp[2];}}}

      if(dn>0){ // film density: deeper mids, richer colour, highlights kept
        r=r>0?Math.pow(r,1+dn*(1-r*.5)):r; g=g>0?Math.pow(g,1+dn*(1-g*.5)):g; b=b>0?Math.pow(b,1+dn*(1-b*.5)):b; }
      if(a.mono){const l=.2126*r+.7152*g+.0722*b;r=g=b=l;}
      if(fade>0){r=r*fM+fA;g=g*fM+fA;b=b*fM+fA;}
      if(vig>0){const nx=(x+.5)/w-.5,dd=Math.sqrt(nx*nx+ny*ny)*1.4142,m=1-vig*.75*smooth(.4,1.05,dd);r*=m;g*=m;b*=m;}
      if(leak>0){const dx=1-(x+.5)/w,dist=Math.sqrt(dx*dx+ly*ly);let lt=Math.max(0,1-dist/.9);lt=lt*lt*leak;

      d[i]=r*255+.5;d[i+1]=g*255+.5;d[i+2]=b*255+.5;
    }

}
// Halation (film's red glow around bright light) and bloom (soft white glow)
function applyGlow(d,w,h,a){
  const hal=a.halation/100,blo=a.bloom/100; if(hal<=0&&blo<=0) return;
  const f=4,sw=Math.max(2,Math.ceil(w/f)),sh=Math.max(2,Math.ceil(h/f)),m=new Float32Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(Math.min(h-1,y*f)*w+Math.min(w-1,x*f))*4;
    const l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;const v=Math.max(0,(l-.6)/.4);m[y*sw+x]=v*v;}
  const g=boxBlur(m,sw,sh,1,Math.max(1,Math.round(Math.min(sw,sh)*.035)),3);
  const kr=hal*1.1+blo*.7,kg=hal*.28+blo*.62,kb=hal*.12+blo*.5;
  for(let y=0;y<h;y++){const fy=Math.min(sh-1.001,y/f),y0=fy|0,ty=fy-y0;
    for(let x=0;x<w;x++){const fx=Math.min(sw-1.001,x/f),x0=fx|0,tx=fx-x0,o=y0*sw+x0;
      const v=(g[o]*(1-tx)+g[o+1]*tx)*(1-ty)+(g[o+sw]*(1-tx)+g[o+sw+1]*tx)*ty; if(v<.002) continue;
      const i=(y*w+x)*4;
      d[i]=255-(255-d[i])*(1-Math.min(1,v*kr)); d[i+1]=255-(255-d[i+1])*(1-Math.min(1,v*kg)); d[i+2]=255-(255-d[i+2])*(1-Math.min(1,v*kb));}}
}
function applyGrain(d,w,h,a){
  const amt=a.grain/100*.16; if(amt<=0) return;
  const px=Math.max(1,Math.min(w,h)/900*(.6+a.grainSize/40));
  for(let y=0;y<h;y++){const gy=Math.floor(y/px);for(let x=0;x<w;x++){const i=(y*w+x)*4;
    const l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255,n=hash(Math.floor(x/px),gy)*amt*(1-Math.abs(l-.5)*1.2)*255;

function meanLum(d){let s=0,n=0;for(let i=0;i<d.length;i+=64){s+=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];n++;}return n?s/n/255:0;}

function balance(d,before,a){

  const g=Math.max(.55,Math.log(target)/Math.log(after)); if(g>.995) return;

function boxBlur(src,w,h,ch,r,passes){ // src: Float32Array with ch channels
  let a=Float32Array.from(src),b=new Float32Array(src.length);r=Math.max(1,Math.min(r,(Math.min(w,h)>>1)-1));const div=2*r+1;
  for(let p=0;p<passes;p++){
    for(let y=0;y<h;y++)for(let c=0;c<ch;c++){let s=0;const o=y*w;for(let k=-r;k<=r;k++)s+=a[(o+Math.min(w-1,Math.max(0,k)))*ch+c];
      for(let x=0;x<w;x++){b[(o+x)*ch+c]=s/div;s+=a[(o+Math.min(w-1,x+r+1))*ch+c]-a[(o+Math.max(0,x-r))*ch+c];}}
    for(let x=0;x<w;x++)for(let c=0;c<ch;c++){let s=0;for(let k=-r;k<=r;k++)s+=b[(Math.min(h-1,Math.max(0,k))*w+x)*ch+c];
      for(let y=0;y<h;y++){a[(y*w+x)*ch+c]=s/div;s+=b[(Math.min(h-1,y+r+1)*w+x)*ch+c]-b[(Math.max(0,y-r)*w+x)*ch+c];}}
  }
  return a;
}
const aiCache=new WeakMap();
function aiPrep(canvas,d,w,h){
  let c=aiCache.get(canvas); if(c) return c;
  const rgb=new Float32Array(w*h*3),mask=new Float32Array(w*h);
  for(let i=0,j=0,k=0;i<d.length;i+=4,j+=3,k++){const r=d[i],g=d[i+1],b=d[i+2];rgb[j]=r;rgb[j+1]=g;rgb[j+2]=b;
    const y=.299*r+.587*g+.114*b,cb=128-.168736*r-.331264*g+.5*b,cr=128+.5*r-.418688*g-.081312*b;
    const sc=smooth(126,136,cr)*(1-smooth(172,182,cr))*smooth(72,82,cb)*(1-smooth(126,136,cb))*smooth(35,60,y);mask[k]=sc;}
  const s=Math.min(w,h);
  c={blur:boxBlur(rgb,w,h,3,Math.round(s*.012),3),mask:boxBlur(mask,w,h,1,Math.round(s*.01),2)};
  aiCache.set(canvas,c); return c;
}
function applyAI(canvas,d,w,h,ai){
  if(!(ai.smooth||ai.tone||ai.brighten||ai.details)) return;
  const {blur,mask}=aiPrep(canvas,d,w,h);
  const sm=ai.smooth/100*.9,to=ai.tone/100,br=ai.brighten/100*.22,de=ai.details/100*.7;
  for(let k=0,i=0,j=0;k<w*h;k++,i+=4,j+=3){
    const r0=d[i]/255,g0=d[i+1]/255,b0=d[i+2]/255,br0=blur[j]/255,bg0=blur[j+1]/255,bb0=blur[j+2]/255,m=mask[k];
    let r=r0,g=g0,b=b0;
    if(m>0.01){
      if(sm){const diff=(Math.abs(r-br0)+Math.abs(g-bg0)+Math.abs(b-bb0))/3,keep=Math.max(0,Math.min(1,1-diff*5)),ws=m*sm*(.35+.65*keep);r+=(br0-r)*ws;g+=(bg0-g)*ws;b+=(bb0-b)*ws;}
      if(to){const tt=m*to;r-=(r-g)*.22*tt;b+=(g-b)*.08*tt;}
      if(br){const bt=m*br;r+=(1-r)*bt;g+=(1-g)*bt;b+=(1-b)*bt;}
    }
    if(de){const dm=de*(1-m);r+=(r0-br0)*dm;g+=(g0-bg0)*dm;b+=(b0-bb0)*dm;}
    d[i]=r*255+.5;d[i+1]=g*255+.5;d[i+2]=b*255+.5;
  }
}

const ASPECTS=[["Original",null],["1:1",1],["4:5",.8],["9:16",9/16],["16:9",16/9]];
const FRAMES=[["None",null],["Film","#0d0d0c"],["Black","#0d0d0c"],["White","#fafaf7"],["Polaroid","#f6f3ec"],["Cream","#ede3cf"]];
const BGS=[["Crop",null],["Blur",null],["Cream","#ede3cf"],["Sand","#d9c29a"],["Slate","#7c93ad"],["Coral","#d9826a"],["Black","#0b0b0b"]];
function drawCropped(ctx,img,dx,dy,dw,dh,cx,cy){
  const ratio=dw/dh,bw=img.width,bh=img.height;let sw=bw,sh=bw/ratio;if(sh>bh){sh=bh;sw=bh*ratio;}
  const l=Math.min(bw-sw,Math.max(0,cx*bw-sw/2)),t=Math.min(bh-sh,Math.max(0,cy*bh-sh/2));
  ctx.drawImage(img,l,t,sw,sh,dx,dy,dw,dh);
}
function compose(src,p,maxLong,watermark){
  const ratio=p.aspect??src.width/src.height;let ow,oh;
  if(ratio>=1){ow=maxLong;oh=Math.round(maxLong/ratio);}else{oh=maxLong;ow=Math.round(maxLong*ratio);}
  const out=document.createElement("canvas");out.width=ow;out.height=oh;const c=out.getContext("2d");c.imageSmoothingQuality="high";
  const u=Math.min(ow,oh),f=FRAMES[p.frame][0];
  const ins=f==="None"?[0,0,0,0]:f==="Film"?[u*.05,u*.09,u*.05,u*.09]:f==="Polaroid"?[u*.05,u*.05,u*.05,u*.2]:[u*.045,u*.045,u*.045,u*.045];
  if(FRAMES[p.frame][1]){c.fillStyle=FRAMES[p.frame][1];c.fillRect(0,0,ow,oh);}
  const ix=ins[0],iy=ins[1],iw=ow-ins[0]-ins[2],ih=oh-ins[1]-ins[3];
  const bg=BGS[p.bg];
  if(bg[0]==="Crop") drawCropped(c,src,ix,iy,iw,ih,p.cx,p.cy);
  else{
    if(bg[0]==="Blur"){const tiny=document.createElement("canvas");tiny.width=Math.max(1,src.width>>5);tiny.height=Math.max(1,src.height>>5);
      tiny.getContext("2d").drawImage(src,0,0,tiny.width,tiny.height);c.save();c.imageSmoothingEnabled=true;drawCropped(c,tiny,ix,iy,iw,ih,.5,.5);c.restore();
      c.fillStyle="rgba(0,0,0,.15)";c.fillRect(ix,iy,iw,ih);}
    else{c.fillStyle=bg[1];c.fillRect(ix,iy,iw,ih);}
    const m=u*.06,s=Math.min((iw-2*m)/src.width,(ih-2*m)/src.height),dw=src.width*s,dh=src.height*s;
    c.drawImage(src,ix+iw/2-dw/2,iy+ih/2-dh/2,dw,dh);
  }
  if(f==="Film"){c.fillStyle="#2c2a26";const hw=u*.035,hh=ins[1]*.32;for(let x=u*.03;x<ow-hw;x+=hw*2){c.fillRect(x,ins[1]*.12,hw,hh);c.fillRect(x,oh-ins[3]*.12-hh,hw,hh);}
    c.fillStyle="#d89a36";c.font=`${ins[1]*.28}px "IBM Plex Mono", monospace`;c.textAlign="left";c.fillText("MOODCAM 400",u*.05,ins[1]*.86);c.textAlign="right";c.fillText("▸ 12A",ow-u*.05,oh-ins[3]*.32);}
  // Cinema letterbox: black bars down to 2.39:1 inside the photo area
  let lb=0;
  if(p.letterbox&&iw/ih<2.39){lb=(ih-iw/2.39)/2;c.fillStyle="#000";c.fillRect(ix,iy,iw,lb);c.fillRect(ix,iy+ih-lb,iw,lb);}
  if(p.caption.trim()&&p.subtitle){
    // movie-subtitle style: sans, outlined, sits in the lower bar when letterboxed
    const fs=Math.max(12,u*(lb?.045:.05)); c.font=`600 ${fs}px "IBM Plex Sans Thai", sans-serif`; c.textAlign="center";
    const y=lb?iy+ih-lb/2+fs*.35:iy+ih-u*.08; c.lineJoin="round"; c.lineWidth=fs*.18; c.strokeStyle="rgba(0,0,0,.85)";
    c.strokeText(p.caption,ow/2,y); c.fillStyle="#fff3a8"; c.fillText(p.caption,ow/2,y);
  } else if(p.caption.trim()){
    c.textAlign="center";
    if(f==="Polaroid"){c.fillStyle="#2a2622";c.font=`italic ${u*.055}px "Cormorant Garamond", serif`;c.fillText(p.caption,ow/2,iy+ih+ins[3]*.55);}
    else{c.fillStyle="#fff";c.shadowColor="rgba(0,0,0,.6)";c.shadowBlur=u*.015;c.font=`${u*.05}px "Cormorant Garamond", serif`;c.fillText(p.caption,ow/2,iy+ih-u*.07);c.shadowBlur=0;}
  }
  if(p.date){ // film-camera date imprint
    const dt=new Date(),txt=`'${String(dt.getFullYear()).slice(2)} ${String(dt.getMonth()+1).padStart(2," ")} ${String(dt.getDate()).padStart(2,"0")}`;
    const fs=u*.042; c.font=`500 ${fs}px "IBM Plex Mono", monospace`; c.textAlign="right";
    c.shadowColor="rgba(255,120,40,.9)"; c.shadowBlur=fs*.45; c.fillStyle="#ff9a3c";
    c.fillText(txt,ix+iw-u*.04,iy+ih-lb-u*.04-(p.music?u*.2:0)); c.shadowBlur=0;
  }
  if(p.music){ // "Now playing" card
    const cw=Math.min(iw*.86,u*.9),chh=u*.15,cx=ix+(iw-cw)/2,cy=iy+ih-lb-chh-u*.04,r=chh*.22;
    c.fillStyle="rgba(12,12,12,.55)"; c.beginPath(); c.moveTo(cx+r,cy); c.arcTo(cx+cw,cy,cx+cw,cy+chh,r); c.arcTo(cx+cw,cy+chh,cx,cy+chh,r); c.arcTo(cx,cy+chh,cx,cy,r); c.arcTo(cx,cy,cx+cw,cy,r); c.fill();
    const pad=chh*.18,art=chh-pad*2; const gr=c.createLinearGradient(cx+pad,cy+pad,cx+pad+art,cy+pad+art); gr.addColorStop(0,"#d89a36"); gr.addColorStop(1,"#7a3b5c");
    c.fillStyle=gr; c.fillRect(cx+pad,cy+pad,art,art); c.fillStyle="rgba(255,255,255,.9)"; c.font=`${art*.5}px sans-serif`; c.textAlign="center"; c.fillText("♪",cx+pad+art/2,cy+pad+art*.68);
    const tx=cx+pad*2+art; c.textAlign="left"; c.fillStyle="#fff"; c.font=`600 ${chh*.22}px "IBM Plex Sans Thai", sans-serif`;
    c.fillText(p.song||"Untitled",tx,cy+chh*.36,cw-art-pad*4); c.fillStyle="rgba(255,255,255,.7)"; c.font=`${chh*.17}px "IBM Plex Sans Thai", sans-serif`;
    c.fillText(p.artist||"MoodCam",tx,cy+chh*.58,cw-art-pad*4);
    const bw=cw-art-pad*4,by=cy+chh*.76; c.fillStyle="rgba(255,255,255,.25)"; c.fillRect(tx,by,bw,chh*.035); c.fillStyle="#fff"; c.fillRect(tx,by,bw*.38,chh*.035);
    c.beginPath(); c.arc(tx+bw*.38,by+chh*.0175,chh*.05,0,7); c.fill();
  }
  if(watermark){c.textAlign="left";c.font=`600 ${u*.024}px "IBM Plex Sans Thai", sans-serif`;c.fillStyle="rgba(216,154,54,.92)";
    c.shadowColor="rgba(0,0,0,.5)";c.shadowBlur=u*.008;const wm=watermark.split("").join(String.fromCharCode(8202));
    c.fillText(wm,ix+u*.03,f==="Polaroid"?iy+ih+ins[3]*.85:iy+u*.05+(lb||0));c.shadowBlur=0;}
  return out;
}

const S={lookId:"original",lookName:"Original",adj:defAdj(),strength:100,ai:{smooth:0,tone:0,brighten:0,details:0},
  social:{aspect:null,cx:.5,cy:.5,frame:0,bg:0,caption:"",letterbox:false,subtitle:false,date:false,music:false,song:"",artist:""},watermark:true,quality:.92};
const grade=()=>effective(S.adj,S.strength/100);
let full=null,prev=null,sourceName="SAMPLE",tab="looks",adjTab="color",band=0,aiTool="auto",lookCat="movie",lastOut=null;
const hist={undo:[],redo:[],last:null};
const snap=()=>JSON.stringify({lookId:S.lookId,lookName:S.lookName,adj:S.adj,strength:S.strength,ai:S.ai,social:S.social});
function commit(){const s=snap();if(s===hist.last)return;if(hist.last)hist.undo.push(hist.last);if(hist.undo.length>60)hist.undo.shift();hist.redo=[];hist.last=s;syncHist();}
function restore(s){Object.assign(S,JSON.parse(s));hist.last=s;syncHist();renderPanel();requestRender();}
function syncHist(){$("#undo").disabled=!hist.undo.length;$("#redo").disabled=!hist.redo.length;}
const $=q=>document.querySelector(q);

function scaled(img,maxSide){const s=Math.min(1,maxSide/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);return c;}
function renderEdit(base){
  const w=base.width,h=base.height,ctx=base.getContext("2d",{willReadFrequently:true}),id=ctx.getImageData(0,0,w,h);
  applyAI(base,id.data,w,h,S.ai); applyGrade(id.data,w,h,grade());
  const out=document.createElement("canvas");out.width=w;out.height=h;out.getContext("2d").putImageData(id,0,0);return out;
}
const wmText=()=>S.watermark?"MOODCAM · "+S.lookName.toUpperCase():null;
let dirty=false,rendering=false,showOriginal=false;
function requestRender(){dirty=true;if(!rendering){rendering=true;requestAnimationFrame(doRender);}}
function doRender(){
  if(!prev){rendering=false;return;}
  dirty=false;
  const view=$("#view"),vc=view.getContext("2d");
  const img=showOriginal?prev:compose(renderEdit(prev),S.social,Math.max(prev.width,prev.height),wmText());
  lastOut=img;view.width=img.width;view.height=img.height;vc.drawImage(img,0,0);
  $("#tag").textContent=(showOriginal?"ORIGINAL":sourceName+" · "+S.lookName.toUpperCase());
  $("#hint").hidden=!(tab==="social"&&BGS[S.social.bg][0]==="Crop"&&S.social.aspect!==null);
  if(dirty) requestAnimationFrame(doRender); else rendering=false;
}

// ---------- thumbnails
let thumbSrc=null;const thumbCache=new Map();
function thumbFor(look){
  const key=look.id+JSON.stringify(look.adj);if(thumbCache.has(key))return thumbCache.get(key);
  const c=document.createElement("canvas");c.width=thumbSrc.width;c.height=thumbSrc.height;const x=c.getContext("2d");x.drawImage(thumbSrc,0,0);
  const id=x.getImageData(0,0,c.width,c.height);applyGrade(id.data,c.width,c.height,look.adj);x.putImageData(id,0,0);thumbCache.set(key,c);return c;
}

// ---------- load images
function setSource(img,name){
  full=scaled(img,4000);prev=scaled(full,1400);sourceName=name;
  const t=document.createElement("canvas");const r=prev.width/prev.height;t.height=200;t.width=Math.round(200*r);
  const tw=Math.min(t.width,150),th=200;const tc=document.createElement("canvas");tc.width=tw;tc.height=th;drawCropped(tc.getContext("2d"),prev,0,0,tw,th,.5,.5);
  thumbSrc=tc;thumbCache.clear();

  renderPanel();requestRender();
}
function loadFile(file){
  if(!file)return;const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{setSource(img,"PHOTO");URL.revokeObjectURL(url);toast("โหลดรูปแล้ว — เลือก Look ได้เลย");};
  img.onerror=()=>{toast("เปิดไฟล์นี้ไม่ได้ ลองใช้ JPG หรือ PNG");URL.revokeObjectURL(url);};
  img.src=url;

$("#pick").addEventListener("change",e=>{loadFile(e.target.files[0]);e.target.value="";});

function sampleScene(w=1050,h=1400){ // same golden-hour scene as the Android sample image
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
  let g=x.createLinearGradient(0,0,0,h*.7);g.addColorStop(0,"#2b3a55");g.addColorStop(.55,"#b8735a");g.addColorStop(1,"#f2b266");x.fillStyle=g;x.fillRect(0,0,w,h);
  g=x.createRadialGradient(w*.62,h*.55,0,w*.62,h*.55,w*.45);g.addColorStop(0,"rgba(255,226,168,.8)");g.addColorStop(1,"rgba(255,226,168,0)");x.fillStyle=g;x.fillRect(0,0,w,h);

  g=x.createLinearGradient(0,h*.66,0,h);g.addColorStop(0,"#3a2c2a");g.addColorStop(1,"#120e0d");x.fillStyle=g;
  x.beginPath();x.moveTo(0,h*.7);x.bezierCurveTo(w*.3,h*.66,w*.6,h*.74,w,h*.68);x.lineTo(w,h);x.lineTo(0,h);x.fill();
  x.fillStyle="#0e0b0a";const fx=w*.3,fy=h*.72;x.beginPath();x.arc(fx,fy-h*.2,w*.045,0,7);x.fill();
  x.beginPath();x.moveTo(fx-w*.09,fy+h*.1);x.bezierCurveTo(fx-w*.09,fy-h*.12,fx-w*.05,fy-h*.16,fx,fy-h*.16);x.bezierCurveTo(fx+w*.05,fy-h*.16,fx+w*.09,fy-h*.12,fx+w*.09,fy+h*.1);x.fill();
  x.fillStyle="#2f4a3a";x.beginPath();x.arc(w*.88,h*.7,w*.12,0,7);x.fill();
  x.fillStyle="#3d6b8c";x.fillRect(0,h*.93,w,h*.07);

}

const fmt=(v,signed)=>{const i=Math.round(v);return signed&&i>0?"+"+i:String(i)};
const GRAD={temp:"linear-gradient(90deg,#4a7bd8,#e6e0d2,#e8b23a)",tint:"linear-gradient(90deg,#4caf6a,#e6e0d2,#d45db0)",
  vibrance:"linear-gradient(90deg,#8a8a8a,#e59a3a,#e0493c)",saturation:"linear-gradient(90deg,#7a7a7a,#c77d5a,#e23d3d)",
  hue:"linear-gradient(90deg,#ff4040,#ffc040,#80ff40,#40ffc0,#4080ff,#c040ff,#ff4040)"};
function trackFor(v,min,max,grad){
  if(grad) return grad;
  const p=(v-min)/(max-min)*100,from=min<0?50:0,lo=Math.min(p,from),hi=Math.max(p,from);
  return `linear-gradient(90deg,var(--line) ${lo}%,var(--gold) ${lo}%,var(--gold) ${hi}%,var(--line) ${hi}%)`;
}
function slider(label,id,v,min,max,onInput,opts={}){
  const row=document.createElement("div");row.className="row";
  const signed=min<0,step=opts.step||1,disp=opts.disp||(x=>fmt(x,signed));
  row.innerHTML=`<label for="s_${id}">${label}</label><input type="range" id="s_${id}" min="${min}" max="${max}" step="${step}" value="${v}"><output>${disp(v)}</output>`;
  const inp=row.querySelector("input"),out=row.querySelector("output");
  inp.style.setProperty("--track",trackFor(v,min,max,opts.grad));
  inp.addEventListener("input",()=>{const x=+inp.value;out.textContent=disp(x);inp.style.setProperty("--track",trackFor(x,min,max,opts.grad));onInput(x);requestRender();});
  inp.addEventListener("change",commit);
  if(opts.disabled) inp.disabled=true;
  return row;
}
function chips(items,cur,onPick){const d=document.createElement("div");d.className="sub";
  items.forEach(([k,label])=>{const b=document.createElement("button");b.className="chip"+(k===cur?" on":"");b.textContent=label;b.onclick=()=>onPick(k);d.appendChild(b);});return d;}
function label(t){const d=document.createElement("div");d.className="group-label";d.textContent=t;return d;}
function toggleRow(text,on,onChange){const d=document.createElement("div");d.className="toggle";
  d.innerHTML=`<span>${text}</span><button class="switch" role="switch" aria-checked="${on}" aria-label="${text}"></button>`;
  d.querySelector("button").onclick=e=>{const v=e.currentTarget.getAttribute("aria-checked")!=="true";e.currentTarget.setAttribute("aria-checked",v);onChange(v);};return d;}

function applyLook(l){S.lookId=l.id;S.lookName=l.name;S.adj=clone(l.adj);commit();renderPanel();requestRender();}

  S.strength=Math.round(90+Math.random()*40); lookCat=l.cat; applyLook(l); toast(`🎲 ${l.name} · ${S.strength}%`);

const CATS=[["movie","🎬 Movie Mood"],["music","🎧 Music Mood"],["cine","Cinematic"],["film","Film"],["mine","My Looks"]];
function panelLooks(p){
  const top=document.createElement("div");top.className="footer";top.style.paddingTop="0";top.style.marginBottom="8px";

    b.appendChild(thumbFor(l));const s=document.createElement("span");s.textContent=l.name;b.appendChild(s);b.onclick=()=>applyLook(l);
    if(lookCat==="mine"){const x=document.createElement("span");x.className="del";x.textContent="×";x.title="ลบ";x.style.padding="0";x.style.background="rgba(0,0,0,.6)";x.style.inset="4px 4px auto auto";x.style.width="20px";x.style.textAlign="center";
      x.onclick=e=>{e.stopPropagation();mine=mine.filter(m=>m.id!==l.id);saveMine();renderPanel();toast(`ลบ "${l.name}" แล้ว`);};b.appendChild(x);}
    g.appendChild(b);});
  p.appendChild(g);
}

function panelAdjust(p){
  p.appendChild(chips([["light","Light"],["color","Color"],["hsl","HSL"],["grain","Grain"],["effects","Effects"]],adjTab,k=>{adjTab=k;renderPanel();}));
  const a=S.adj,set=k=>v=>{a[k]=v;};
  if(adjTab==="light"){[["Exposure","exposure"],["S-Curve","curve"],["Density","density"],["Contrast","contrast"],["Highlights","highlights"],["Shadows","shadows"],["Blacks","blacks"]].forEach(([l,k])=>p.appendChild(slider(l,k,a[k],(k==="curve"||k==="density")?0:-100,100,set(k))));}
  if(adjTab==="color"){[["Temp","temp"],["Tint","tint"],["Vibrance","vibrance"],["Saturation","saturation"]].forEach(([l,k])=>p.appendChild(slider(l,k,a[k],-100,100,set(k),{grad:GRAD[k]})));}
  if(adjTab==="hsl"){
    const names=["Red","Orange","Yellow","Green","Blue","Purple"],cols=["#e5484d","#f08a3a","#f2d046","#4caf6a","#3d7fe0","#9b59d0"];
    const bd=document.createElement("div");bd.className="bands";
    cols.forEach((c,i)=>{const b=document.createElement("button");b.className="band"+(i===band?" on":"");b.style.background=c;b.title=names[i];b.setAttribute("aria-label",names[i]);b.onclick=()=>{band=i;renderPanel();};bd.appendChild(b);});
    p.appendChild(bd);p.appendChild(label(names[band].toUpperCase()));
    const hb=a.hsl[band];
    p.appendChild(slider("Hue","h"+band,hb.hue,-100,100,v=>hb.hue=v,{grad:GRAD.hue}));
    p.appendChild(slider("Saturation","s"+band,hb.sat,-100,100,v=>hb.sat=v));
    p.appendChild(slider("Luminance","l"+band,hb.lum,-100,100,v=>hb.lum=v));
  }
  if(adjTab==="grain"){p.appendChild(slider("Amount","grain",a.grain,0,100,set("grain")));p.appendChild(slider("Size","grainSize",a.grainSize,0,100,set("grainSize")));}
  if(adjTab==="effects"){
    [["Halation","halation"],["Bloom","bloom"],["Vignette","vignette"],["Fade","fade"],["Light Leak","lightLeak"]].forEach(([l,k])=>p.appendChild(slider(l,k,a[k],0,100,set(k))));
    p.appendChild(label("SPLIT TONE"));
    p.appendChild(slider("Shadow hue","shadowTintHue",a.shadowTintHue,0,360,set("shadowTintHue"),{grad:GRAD.hue,disp:v=>Math.round(v)+"°"}));
    p.appendChild(slider("Shadow amt","shadowTintAmt",a.shadowTintAmt,0,100,set("shadowTintAmt")));
    p.appendChild(slider("Midtone hue","midTintHue",a.midTintHue,0,360,set("midTintHue"),{grad:GRAD.hue,disp:v=>Math.round(v)+"°"}));
    p.appendChild(slider("Midtone amt","midTintAmt",a.midTintAmt,0,100,set("midTintAmt")));
    p.appendChild(slider("Highlight hue","highlightTintHue",a.highlightTintHue,0,360,set("highlightTintHue"),{grad:GRAD.hue,disp:v=>Math.round(v)+"°"}));
    p.appendChild(slider("Highlight amt","highlightTintAmt",a.highlightTintAmt,0,100,set("highlightTintAmt")));
    p.appendChild(toggleRow("Black & White",a.mono,v=>{a.mono=v;commit();requestRender();}));
  }
  const f=document.createElement("div");f.className="footer";
  f.innerHTML=`<button class="chip" id="reset">RESET</button><span class="sp"></span><button class="chip on" id="savelook">SAVE LOOK</button>`;
  p.appendChild(f);
  f.querySelector("#reset").onclick=()=>{const l=allLooks().find(x=>x.id===S.lookId);S.adj=clone(l?l.adj:defAdj());commit();renderPanel();requestRender();};
  f.querySelector("#savelook").onclick=()=>{
    if(f.querySelector("input"))return;
    const box=document.createElement("div");box.className="footer";
    box.innerHTML=`<input class="text" id="lookname" maxlength="28" value="My ${S.lookName.replace(/^My /,"")}" aria-label="ชื่อ Look"><button class="chip on" id="lookok">บันทึก</button>`;
    p.appendChild(box);box.querySelector("input").focus();
    box.querySelector("#lookok").onclick=()=>{const name=box.querySelector("input").value.trim()||"My Look";
      const l={id:"custom_"+Date.now().toString(36),name,cat:"mine",adj:clone(S.adj)};mine.unshift(l);saveMine();S.lookId=l.id;S.lookName=name;commit();
      toast(`บันทึก "${name}" ใน My Looks แล้ว`);renderPanel();requestRender();};
  };
}

const AITOOLS=[["auto","Auto","✦"],["smooth","Smooth","◌"],["tone","Tone","◐"],["brighten","Brighten","☀"],["details","Details","◇"]];
function panelAI(p){
  const g=document.createElement("div");g.className="aitools";
  AITOOLS.forEach(([k,l,ic])=>{const b=document.createElement("button");b.className="aitool"+(k===aiTool?" on":"");b.innerHTML=`<i>${ic}</i>${l}`;b.onclick=()=>{aiTool=k;renderPanel();};g.appendChild(b);});
  p.appendChild(g);
  const ai=S.ai;
  if(aiTool==="auto"){
    const v=Math.min(100,ai.smooth/.7);
    p.appendChild(slider("Intensity","ai_auto",v,0,100,x=>{ai.smooth=x*.7;ai.tone=x*.5;ai.brighten=x*.4;ai.details=x*.5;}));
  } else p.appendChild(slider("Intensity","ai_"+aiTool,ai[aiTool],0,100,x=>{ai[aiTool]=x;}));
  const f=document.createElement("div");f.className="footer";f.innerHTML=`<button class="chip" id="aireset">RESET</button>`;p.appendChild(f);
  f.querySelector("#aireset").onclick=()=>{S.ai={smooth:0,tone:0,brighten:0,details:0};commit();renderPanel();requestRender();};

function swatchRow(list,cur,onPick){const d=document.createElement("div");d.className="swatches";

let downloads=null;

function blobToB64(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob);});}
async function saveFull(){
  if(!full)return;$("#busy").hidden=false;await new Promise(r=>setTimeout(r,30));
  let blob;
  try{
    const edited=renderEdit(full);const out=compose(edited,S.social,Math.max(edited.width,edited.height),wmText());
    blob=await new Promise(r=>out.toBlob(r,"image/jpeg",S.quality));
  }catch(e){$("#busy").hidden=true;toast("เรนเดอร์ไม่สำเร็จ: รูปอาจใหญ่เกินไปสำหรับเบราว์เซอร์นี้");return;}
  $("#busy").hidden=true;
  const name="MoodCam_"+S.lookName.replace(/[^A-Za-z0-9]+/g,"")+"_"+new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")+".jpg";
  if(window.MoodCamAndroid){
    const b64=await blobToB64(blob);
    if(CAM.shareNext){CAM.shareNext=false; if(!window.MoodCamAndroid.shareImage(b64,name)) toast("แชร์ไม่สำเร็จ"); return;}
    toast(window.MoodCamAndroid.saveImage(b64,name)?"บันทึกลงแกลเลอรีแล้ว (Pictures/MoodCam)":"บันทึกไม่สำเร็จ");return;
  }
  if(downloads){
    try{await downloads.save({filename:name,data:blob});toast("บันทึกรูปแล้ว");return;}
    catch(e){if(e&&e.code==="declined")return; if(e&&e.code==="rate_limited"){toast("รอสักครู่แล้วลองใหม่");return;}}
  }
  // Fallback: show the image so the viewer can long-press / right-click to save it.
  const url=URL.createObjectURL(blob);const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=`<div><img alt="ภาพที่แต่งแล้ว"><p>กดค้าง (มือถือ) หรือคลิกขวา (คอม) ที่รูปเพื่อบันทึก</p><button class="bigbtn ghost">ปิด</button></div>`;
  sh.querySelector("img").src=url;sh.querySelector("button").onclick=()=>{sh.remove();URL.revokeObjectURL(url);};document.body.appendChild(sh);
}

  S.social.cx=Math.min(1,Math.max(0,S.social.cx-(e.clientX-drag.x)/r.width*.8));S.social.cy=Math.min(1,Math.max(0,S.social.cy-(e.clientY-drag.y)/r.height*.8));
  drag={x:e.clientX,y:e.clientY};requestRender();});

let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

// ======================================================================
// Live camera (getUserMedia). Works when the page is served over HTTPS on its own
// site; inside a sandboxed viewer that blocks the camera it falls back to the
// phone's native camera through the file input.
// ======================================================================
const CAM={stream:null,facing:"environment",timer:0,grid:true,torch:false,track:null,zoomCaps:null};
function liveFilter(a){ // CSS approximation of the look for the viewfinder; the captured photo gets the full kernel
  const b=Math.pow(2,a.exposure/100*1.5)*(1+a.fade/100*.06)*(1-a.density/100*.18), c=(a.contrast>=0?1+a.contrast/100*.9:1+a.contrast/100*.5)*(1-a.fade/100*.2)*(1-a.blacks/100*.25)*(1+a.curve/100*.35+a.density/100*.15);
  const s=a.mono?0:Math.max(0,(1+a.saturation/100)*(1+a.vibrance/100*.3));
  const warm=Math.max(0,a.temp)/100*.45+a.highlightTintAmt/100*.12, hue=-a.tint/100*12+(a.temp<0?a.temp/100*25:0);
  return `brightness(${b.toFixed(3)}) contrast(${c.toFixed(3)}) saturate(${s.toFixed(3)}) sepia(${warm.toFixed(3)}) hue-rotate(${hue.toFixed(1)}deg)`+(a.mono?" grayscale(1)":"");
}
function camApplyLook(){
  $("#video").style.filter=liveFilter(grade());
  const v=grade().vignette/100;$("#vfvig").style.background=v>0?`radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,${(v*.65).toFixed(2)}) 100%)`:"none";
  $("#camtag").textContent="LIVE · "+S.lookName.toUpperCase();
  const box=$("#camlooks");box.textContent="";
  allLooks().forEach(l=>{const b=document.createElement("button");b.className="chip"+(l.id===S.lookId?" on":"");b.textContent=l.name;
    b.onclick=()=>{applyLook(l);camApplyLook();};box.appendChild(b);});
}
function cameraAllowedHere(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext) return false;
  const fp=document.permissionsPolicy||document.featurePolicy;
  if(fp&&fp.allowsFeature&&!fp.allowsFeature("camera")) return false;
  return true;
}
async function startStream(){
  stopStream();
  CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:CAM.facing},width:{ideal:4096},height:{ideal:3072}}});
  const v=$("#video");v.srcObject=CAM.stream;await v.play().catch(()=>{});
  CAM.track=CAM.stream.getVideoTracks()[0];
  const caps=CAM.track.getCapabilities?CAM.track.getCapabilities():{};
  const settings=CAM.track.getSettings?CAM.track.getSettings():{};
  $("#vf").classList.toggle("front",(settings.facingMode||CAM.facing)==="user");
  $("#camtorch").hidden=!caps.torch;CAM.torch=false;$("#camtorch").classList.remove("on");
  const z=$("#vfzoom");z.textContent="";CAM.zoomCaps=caps.zoom||null;z.hidden=!CAM.zoomCaps;
  if(CAM.zoomCaps){[1,2,5].filter(x=>x>=CAM.zoomCaps.min&&x<=CAM.zoomCaps.max).forEach(x=>{const b=document.createElement("button");b.className="chipbtn"+(x===1?" on":"");b.textContent=x+"x";
    b.onclick=()=>{CAM.track.applyConstraints({advanced:[{zoom:x}]}).catch(()=>{});z.querySelectorAll("button").forEach(o=>o.classList.toggle("on",o===b));};z.appendChild(b);});}
}
function stopStream(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;CAM.track=null;}}
async function openCamera(){
  if(!cameraAllowedHere()){$("#cam").click();return;}
  try{
    $("#camsheet").hidden=false;camApplyLook();await startStream();
  }catch(e){
    $("#camsheet").hidden=true;stopStream();
    if(e&&e.name==="NotAllowedError") toast("ไม่ได้รับอนุญาตใช้กล้อง — เปิดสิทธิ์กล้องในการตั้งค่าเบราว์เซอร์ หรือกด ถ่ายรูป อีกครั้งเพื่อใช้แอปกล้องของเครื่อง");
    else toast("เปิดกล้องสดไม่ได้ในหน้านี้ — กด ถ่ายรูป อีกครั้งเพื่อใช้แอปกล้องของเครื่อง");
    CAM.fallbackNext=true;
  }
}
function closeCamera(){stopStream();$("#camsheet").hidden=true;}
async function capture(){
  const v=$("#video");if(!v.videoWidth)return;
  if(CAM.timer){const c=$("#vfcount");c.hidden=false;for(let i=CAM.timer;i>0;i--){c.textContent=i;await new Promise(r=>setTimeout(r,1000));}c.hidden=true;}
  const w=v.videoWidth,h=v.videoHeight,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
  if($("#vf").classList.contains("front")){x.translate(w,0);x.scale(-1,1);}
  x.drawImage(v,0,0,w,h);
  const f=$("#vfflash");f.style.opacity=".8";setTimeout(()=>f.style.opacity="0",60);
  $("#camthumb").style.backgroundImage=`url(${c.toDataURL("image/jpeg",.6)})`;
  const look=allLooks().find(l=>l.id===S.lookId);
  setSource(c,"PHOTO");if(look){S.lookId=look.id;S.lookName=look.name;S.adj=clone(look.adj);hist.last=snap();renderPanel();requestRender();}
  toast(`ถ่ายแล้ว ${w}×${h} · ${S.lookName} — กดรูปเล็กเพื่อไปแต่ง`);
}
$("#shoot").onclick=()=>{if(CAM.fallbackNext){CAM.fallbackNext=false;$("#cam").click();return;}openCamera();};
$("#camclose").onclick=closeCamera;
$("#camthumb").onclick=()=>{closeCamera();tab="looks";document.querySelectorAll("#tabs [data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="looks"));renderPanel();requestRender();};
$("#shutter").onclick=capture;
$("#camflip").onclick=async()=>{CAM.facing=CAM.facing==="environment"?"user":"environment";try{await startStream();}catch(e){toast("สลับกล้องไม่ได้");}};
$("#camgrid").onclick=e=>{CAM.grid=!CAM.grid;$("#vfgrid").hidden=!CAM.grid;e.currentTarget.classList.toggle("on",CAM.grid);};
$("#camtimer").onclick=e=>{CAM.timer=CAM.timer===0?3:CAM.timer===3?10:0;e.currentTarget.textContent=CAM.timer?`Timer ${CAM.timer}s`:"Timer";e.currentTarget.classList.toggle("on",!!CAM.timer);};
$("#camtorch").onclick=e=>{CAM.torch=!CAM.torch;CAM.track&&CAM.track.applyConstraints({advanced:[{torch:CAM.torch}]}).catch(()=>{});e.currentTarget.classList.toggle("on",CAM.torch);};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&CAM.stream)closeCamera();});

// ---------- PWA: offline + "install app" button
if("serviceWorker" in navigator&&location.protocol==="https:"){
  // updateViaCache:none -> the browser never serves a stale sw.js; reload once when a new version takes over
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update().catch(()=>{});}).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloaded){reloaded=true;location.reload();}});
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("#install").hidden=false;});
$("#install").onclick=async()=>{if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;$("#install").hidden=true;if(r.outcome==="accepted")toast("ติดตั้ง MoodCam ลงหน้าจอแล้ว");};
window.addEventListener("appinstalled",()=>{$("#install").hidden=true;});

if(window.MoodCamAndroid){$("#edition").textContent="FILM CAMERA · APP · v3";}
// ---------- boot: open with the sample scene and a look applied so the editor is live
setSource(sampleScene(),"SAMPLE");
applyLook(PRESETS.find(l=>l.id==="neon_2049"));
hist.undo=[];hist.last=snap();syncHist();
if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});}
</script>
