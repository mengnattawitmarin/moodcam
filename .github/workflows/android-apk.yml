name: Build MoodCam APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build signed APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk MoodCam.apk
      - name: Publish APK on GitHub Pages (same site as the app, direct download)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          cp MoodCam.apk ./MoodCam-download.apk
          mv MoodCam-download.apk MoodCam.apk.tmp && mv MoodCam.apk.tmp MoodCam.apk
          git add -f MoodCam.apk
          git commit -m "APK build ${{ github.run_number }}" || echo "no change"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: MoodCam-apk
          path: MoodCam.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MoodCam APK (build ${{ github.run_number }})
          body: |
            ดาวน์โหลด MoodCam.apk ด้านล่าง แล้วแตะเพื่อติดตั้ง (อนุญาต "ติดตั้งแอปที่ไม่รู้จัก")
            แอปโหลด MoodCam จาก https://mengnattawitmarin.github.io/moodcam/ จึงอัปเดตเองเมื่อเว็บอัปเดต
          files: MoodCam.apk
          make_latest: true
